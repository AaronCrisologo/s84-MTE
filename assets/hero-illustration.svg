<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">A browser window holding an open book</title>
  <desc id="heroDesc">A dark browser window with an open book and a progress bar, surrounded by floating study cards.</desc>

  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".30"/>
    </filter>
  </defs>

  <!-- browser window -->
  <g>
    <rect x="96" y="96" width="368" height="256" rx="18" fill="url(#screenGrad)"/>
    <path d="M96 114a18 18 0 0 1 18-18h332a18 18 0 0 1 18 18v20H96z" fill="#111c2e"/>
    <circle cx="122" cy="116" r="5" fill="#f87171"/>
    <circle cx="140" cy="116" r="5" fill="#fbbf24"/>
    <circle cx="158" cy="116" r="5" fill="#34d399"/>

    <!-- open book -->
    <path d="M200 190q33-14 66 0v92q-33-12-66 0z" fill="#e2e8f0"/>
    <path d="M332 190q-33-14-66 0v92q33-12 66 0z" fill="#f8fafc"/>
    <path d="M266 190v92" stroke="#cbd5e1" stroke-width="2"/>

    <!-- lines of text -->
    <g fill="#94a3b8">
      <rect x="212" y="210" width="42" height="5" rx="2.5"/>
      <rect x="212" y="224" width="36" height="5" rx="2.5"/>
      <rect x="212" y="238" width="40" height="5" rx="2.5"/>
      <rect x="278" y="210" width="42" height="5" rx="2.5"/>
      <rect x="278" y="224" width="34" height="5" rx="2.5"/>
      <rect x="278" y="238" width="38" height="5" rx="2.5"/>
    </g>

    <!-- progress bar -->
    <rect x="196" y="306" width="168" height="10" rx="5" fill="#1e293b"/>
    <rect x="196" y="306" width="112" height="10" rx="5" fill="url(#barGrad)"/>
  </g>

  <!-- floating card: check -->
  <g filter="url(#cardShadow)">
    <rect x="36" y="140" width="104" height="104" rx="22" fill="#ffffff"/>
  </g>
  <circle cx="88" cy="192" r="28" fill="#d1fae5"/>
  <path d="M76 192l9 10 18-20" fill="none" stroke="#059669" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- floating card: play -->
  <g filter="url(#cardShadow)">
    <rect x="420" y="92" width="104" height="104" rx="22" fill="#ffffff"/>
  </g>
  <circle cx="472" cy="144" r="28" fill="#e0e7ff"/>
  <path d="M466 132l20 12-20 12z" fill="#4f46e5"/>

  <!-- floating card: chart -->
  <g filter="url(#cardShadow)">
    <rect x="396" y="272" width="128" height="96" rx="22" fill="#ffffff"/>
  </g>
  <rect x="418" y="316" width="16" height="32" rx="6" fill="#c7d2fe"/>
  <rect x="444" y="300" width="16" height="48" rx="6" fill="#818cf8"/>
  <rect x="470" y="286" width="16" height="62" rx="6" fill="#14b8a6"/>
  <rect x="496" y="302" width="16" height="46" rx="6" fill="#2dd4bf"/>
</svg>